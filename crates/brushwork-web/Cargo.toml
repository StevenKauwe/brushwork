[package]
name = "brushwork-web"
description = "brushwork's canvas page: lay down flat shapes, then paint them in oil (in a Web Worker, on the GPU through WebGPU where the browser offers it, else on the CPU)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
brushwork.workspace = true
brushwork-paint.workspace = true
brushwork-kit.workspace = true
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

# In the browser the worker lays strokes on the GPU when WebGPU offers one (brushwork's async GPU path).
[target.'cfg(target_arch = "wasm32")'.dependencies]
brushwork = { workspace = true, features = ["gpu"] }
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData",
  "Event", "EventTarget", "PointerEvent", "MouseEvent", "MessageEvent", "ErrorEvent", "Worker", "WorkerOptions",
  "WorkerType", "DedicatedWorkerGlobalScope", "DomTokenList", "DomRect", "Node", "NodeList", "Navigator", "CssStyleDeclaration", "Location",
]
