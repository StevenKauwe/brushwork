[package]
name = "brushwork-web"
description = "brushwork's canvas page: lay down flat shapes, then paint them in oil (the CPU engine in a Web Worker)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
brushwork.workspace = true
brushwork-paint.workspace = true
brushwork-kit.workspace = true
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData",
  "Event", "EventTarget", "PointerEvent", "MouseEvent", "MessageEvent", "ErrorEvent", "Worker", "WorkerOptions",
  "WorkerType", "DedicatedWorkerGlobalScope", "DomTokenList", "DomRect", "Node", "NodeList", "Navigator", "CssStyleDeclaration",
]
